image:
  server:
    repository: monitoring-server
    tag: dev
    pullPolicy: IfNotPresent
  web:
    repository: monitoring-web
    tag: dev
    pullPolicy: IfNotPresent

server:
  replicas: 1
  port: 3001
  resources: {}
  env:
    - name: PORT
      value: "3001"
  secretEnv:
    - name: YELP_API_KEY
      key: yelp-api-key

web:
  replicas: 1
  port: 80
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

